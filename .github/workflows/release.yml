name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run release in dry-run mode (no publishing)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Call the commit workflow to run all tests and linting
  run-tests:
    name: Commit
    uses: ./.github/workflows/commit.yml

  read-node-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.node.outputs.version }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 1
    - name: Read Node.js version
      id: node
      run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

  release:
    runs-on: ubuntu-latest
    container:
      image: node:${{ needs.read-node-version.outputs.version }}
    needs:
    - run-tests
    - read-node-version
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Generate GitHub App token
      id: app-token
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ vars.RELEASE_APP_ID }}
        private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    - name: Checkout code
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0
        token: ${{ steps.app-token.outputs.token }}
    - name: Configure Git
      run: |
        git config --global --add safe.directory /__w/openlint/openlint
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
    - name: Cached dependencies
      uses: "./.github/actions/cached-dependencies"
    - name: Build
      run: yarn build
    - name: Release
      run: yarn release ${{ inputs.dry-run && '--dry-run' || '' }}
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
